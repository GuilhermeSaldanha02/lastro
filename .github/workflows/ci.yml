name: CI

# Gate mecânico: roda os mesmos checks que o pré-commit exige, em toda PR e
# em todo push na main. É o que permite item determinístico do QA.md "graduar"
# para automação — sem CI, todo check fica manual para sempre.

on:
  push:
    branches: [main]
  pull_request:
  # O E2E usa o Supabase hospedado e hoje leva cerca de 25 minutos. Ele é
  # acionado manualmente nos marcos de integração; os checks rápidos seguem
  # obrigatórios em toda PR e push na main.
  #
  # `specs` filtra o E2E: só o que mudou, em vez dos ~25 minutos da suíte
  # inteira. Passe pedaços dos nomes dos arquivos separados por espaço
  # (`j27 j28`, `catalogo`); vazio roda tudo. Exemplo:
  #   gh workflow run ci.yml --ref main -f specs="j27 j28"
  workflow_dispatch:
    inputs:
      specs:
        description: 'Specs do E2E a rodar (ex.: "j27 j28"). Vazio = suíte completa.'
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      # O `tsc --noEmit` roda DEPOIS do build, e a ordem é obrigatória: o Next
      # gera tipos globais (`LayoutProps`, tipos de rota, CSS) em `.next/types`
      # durante o build. Em máquina de desenvolvimento isso passa despercebido
      # porque sobra `.next` de builds anteriores — em runner limpo, `tsc` antes
      # do build falha com TS2304. Verificado neste repositório em 2026-08-23.
      #
      # Os valores abaixo caem para um placeholder quando o secret não existe,
      # para o build não quebrar por variável ausente. Para o build refletir a
      # realidade, cadastre os secrets em Settings → Secrets and variables →
      # Actions. Nenhum valor real fica neste arquivo.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://exemplo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder' }}

      - name: Type-check
        run: npx tsc --noEmit

      # Fase 6 (escopo reduzido, 2026-08-31): as 3 jornadas do PRD §6 contra
      # o Supabase HOSPEDADO de verdade (não há stack local, ver
      # KNOWLEDGE.md) — cada spec cria e apaga seu próprio usuário QA
      # descartável (e2e/helpers/usuario-descartavel.ts), então PRECISA de
      # secrets reais, sem placeholder: sem eles o passo falha alto, não
      # silenciosamente contra um projeto que não existe. /api/analise e
      # /api/coach são interceptados no navegador nos specs J2/J3 — a
      # Gemini real nunca é chamada por este workflow (cota de 20 req/dia,
      # KNOWLEDGE.md §3.2, não é pra queimar em todo push).
      - name: Instalar navegador do Playwright
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: E2E (jornadas J1/J2/J3 do PRD §6 + varredura de navegação)
        if: github.event_name == 'workflow_dispatch'
        # SPECS vem por variável (não interpolado no comando) e sem aspas de
        # propósito: cada palavra vira um filtro do Playwright.
        run: npm run e2e -- $SPECS
        env:
          SPECS: ${{ inputs.specs }}
          # E2E-PROD (2026-10-02): o e2e roda contra o projeto Supabase de TESTE
          # (`lastro-teste`), nunca contra a produção. Os secrets `TESTE_*` não
          # têm fallback de propósito: sem eles o passo falha alto. A trava em
          # `playwright.config.ts` recusa a URL de produção.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TESTE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TESTE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TESTE_SUPABASE_SERVICE_ROLE_KEY }}
          CI: true

      # As capturas da varredura (j4) sao o unico jeito de OLHAR o app em
      # tres larguras sem a conta do dono. `if: always()` de proposito: a
      # execucao que FALHA e justamente a que precisa ser vista.
      - name: Guardar capturas da varredura
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: varredura-telas
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
