<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lastro — sem conexão</title>
    <style>
      :root {
        color-scheme: light dark;
        --fundo: #ffffff;
        --texto: #171717;
        --secundario: #666666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #0a0a0a;
          --texto: #ededed;
          --secundario: #999999;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--fundo);
        color: var(--texto);
      }
      p {
        margin: 0;
        max-width: 30ch;
        color: var(--secundario);
        line-height: 1.5;
      }
      button {
        padding: 0.75rem 1.5rem;
        font: inherit;
        border: 1px solid var(--secundario);
        border-radius: 0.5rem;
        background: transparent;
        color: var(--texto);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Sem conexão</h1>
    <p>
      As séries que você registrar continuam salvas no aparelho e sobem sozinhas
      quando a rede voltar.
    </p>
    <button onclick="location.reload()">Tentar de novo</button>
    <script>
      // OF-09 (QA.md, 2026-09-23): com a rede de volta, esta página ficava
      // parada até alguém tocar em "Tentar de novo" — e, sem o JS do app,
      // nada drenava a fila. Recarregar sozinha leva de volta à tela que a
      // pessoa pediu, e é lá que as séries pendentes sobem.
      //
      // Recarregar direto no evento `online` falhava em metade das vezes
      // (auditoria independente, 7 de 14): o aviso chega antes de a rede
      // aceitar conexão, o reload cai de novo nesta página (vinda do cache
      // do service worker em ~20 ms) e o evento não se repete. Por isso a
      // página só recarrega depois que uma sonda à rede responde, e segue
      // sondando a cada 2 s — também cobre aparelho que nunca dispara
      // `online`. Offline a sonda falha na hora, sem custo.
      (function () {
        var sondando = false;
        function tentarVoltar() {
          if (sondando) return;
          sondando = true;
          fetch("/manifest.webmanifest?sonda=" + Date.now(), { cache: "no-store" })
            .then(function (resposta) {
              if (resposta.ok) location.reload();
            })
            .catch(function () {})
            .then(function () {
              sondando = false;
            });
        }
        window.addEventListener("online", tentarVoltar);
        setInterval(tentarVoltar, 2000);
      })();
    </script>
  </body>
</html>
